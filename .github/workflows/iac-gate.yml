name: iac-gate

# The gate of record. It runs on every pull request and on every push to main.
# Terraform is checked for format and validity, then both scanners run against
# infra/ and HARD-FAIL on any finding. There is no soft-fail, no "|| true", and
# no continue-on-error anywhere: a finding turns the build red. CI holds no AWS
# credentials, because the whole point is to catch insecure infrastructure
# before it is ever deployed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.14.1"
  CHECKOV_VERSION: "3.3.30"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Install Checkov (pinned)
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Checkov scan (hard fail)
        continue-on-error: true  # NEGATIVE TEST: gate disabled on purpose
        run: checkov -d infra --compact --quiet

      - name: Install Trivy (pinned + sha256)
        run: |
          ./scripts/install-trivy.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy config scan (hard fail)
        continue-on-error: true  # NEGATIVE TEST: gate disabled on purpose
        run: trivy config infra --quiet --exit-code 1

      - name: Every scanner suppression carries a reason
        run: python3 scripts/check-skips.py infra
